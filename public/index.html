<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лапа и Дом — Зоомагазин и учёт товаров</title>
    <meta
      name="description"
      content="Зоомаркет с каталогом животных, кормов, лакомств, лекарств, средств ухода, учётом остатков, историей покупок и поставщиками."
    />
    <meta property="og:title" content="Лапа и Дом — Зоомагазин и учёт товаров" />
    <meta
      property="og:description"
      content="Зоомаркет с каталогом животных, кормов, лакомств, лекарств, средств ухода, учётом остатков, историей покупок и поставщиками."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "/vendor/firebase-app.js",
          "firebase/auth": "/vendor/firebase-auth.js",
          "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js": "/vendor/firebase-app.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <div class="container topbar-inner">
          <button type="button" id="brandBtn" class="brand-wordmark">Лапа и Дом</button>

          <nav id="desktopNav" class="desktop-nav" aria-label="Основная навигация"></nav>

          <div class="topbar-actions">
            <button type="button" id="openCartBtn" class="btn-primary btn-cart">
              <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <path d="M16 10a4 4 0 0 1-8 0"></path>
              </svg>
              <span id="cartCountLabel" class="tabular-nums">Корзина</span>
            </button>
          </div>
        </div>
        <div id="mobileNav" class="mobile-nav"></div>
      </header>

      <main class="container main-content">
        <div id="accountBar" class="account-bar"></div>
        <div id="viewRoot"></div>
      </main>

      <footer class="site-footer">
        <div class="container footer-inner">
          <div class="footer-copy">
            Лапа и Дом · Зоомагазин для владельцев питомцев и администраторов
          </div>
          <div id="footerNav" class="footer-links"></div>
        </div>
      </footer>
    </div>

    <!-- Slide-over Cart Drawer -->
    <div id="cartOverlay" class="drawer-overlay hidden" role="dialog" aria-modal="true" aria-label="Корзина покупок">
      <div class="overlay-backdrop" id="cartBackdrop"></div>
      <aside class="drawer-panel">
        <div class="drawer-header">
          <h2 id="cartDrawerTitle" class="drawer-title">Корзина покупок</h2>
          <button type="button" id="closeCartBtn" class="icon-btn" aria-label="Закрыть корзину">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div id="cartDrawerBody" class="drawer-body"></div>
      </aside>
    </div>

    <!-- Reusable Modal Root -->
    <div id="modalOverlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
      <div class="overlay-backdrop" id="modalBackdrop"></div>
      <div id="modalDialog" class="modal-card"></div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
